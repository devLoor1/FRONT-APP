name: Promover develop para main

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Pull Request"
        required: false
        default: "chore: promoção de develop para main"
      body:
        description: "Descrição do Pull Request (opcional)"
        required: false
        default: ""

jobs:
  create-pr:
    name: Criar Pull Request develop → main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se develop está à frente de main
        id: check
        run: |
          git fetch origin main develop
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          echo "commits_ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "::warning::develop não tem commits à frente de main. Nenhum PR será criado."
          else
            echo "develop está $AHEAD commit(s) à frente de main."
          fi

      - name: Criar Pull Request
        if: steps.check.outputs.commits_ahead != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const title = (inputs.title || '').trim() || 'chore: promoção de develop para main';
            const bodyInput = (inputs.body || '').trim();
            const commitsAhead = '${{ steps.check.outputs.commits_ahead }}';

            const bodyParts = [];
            if (bodyInput) bodyParts.push(bodyInput, '');
            bodyParts.push(
              '---',
              `> Gerado automaticamente via GitHub Actions.`,
              `> Branch \`develop\` está **${commitsAhead} commit(s)** à frente de \`main\`.`,
            );
            const body = bodyParts.join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:develop`,
              base: 'main',
              state: 'open',
            });

            if (prs.length > 0) {
              core.warning(`Já existe um PR aberto: #${prs[0].number} — ${prs[0].html_url}`);
              core.summary.addRaw(`**PR existente:** [#${prs[0].number}](${prs[0].html_url})`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: 'develop',
                base: 'main',
              });
              core.info(`PR criado: ${pr.html_url}`);
              core.summary.addRaw(`**PR criado:** [#${pr.number}](${pr.html_url})`);
            }
            await core.summary.write();
